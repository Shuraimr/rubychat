[package]
name = "rubychat"
version = "0.1.0"
description = "rubychat: a Matrix chat client (rubyyard family)"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.96"

[lib]
# staticlib + cdylib are needed for the Android/iOS builds; rlib for the desktop binary
# staticlib + cdylib Android/iOS derlemesi için gerekir; rlib masaüstü ikilisi için
name = "rubychat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Calls inside the app instead of Element Call in an iframe. Needs a C++ toolchain, so off by default (see flatpak/derle.sh).
# iframe'deki Element Call yerine uygulama içi aramalar. C++ araçları ister, bu yüzden varsayılan kapalı (bkz. flatpak/derle.sh).
yerel-arama = ["dep:matrix-rtc-call-sdk", "dep:matrix-rtc-call", "dep:matrix-rtc-core", "dep:matrix-rtc-transport", "dep:libwebrtc", "dep:rustls", "dep:libc", "dep:matrix-sdk-base"]

[patch.crates-io]
# Stereo sound, which livekit 0.9.7 lacks; see ../motor/yama/README.md. · livekit 0.9.7'de olmayan stereo ses.
livekit = { path = "../motor/yama/livekit" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures-util = "0.3"
eyeball-im = "0.9"
rand = "0.9"
url = "2"
# Already in the lock file (transitive): MIME types for attachments, base64 for the chunked file upload from the webview.
# Kilit dosyasında zaten var (dolaylı): ek dosyaların MIME türleri; webview'den parçalı dosya yüklemesi için base64.
mime = "0.3"
base64 = "0.22"
# JNI helpers (Kotlin media/notification code). Pure Rust, so they also compile on the desktop where `cargo check` runs;
# the calls themselves only happen on Android.
# JNI yardımcıları (Kotlin medya/bildirim kodu). Saf Rust; `cargo check`in çalıştığı masaüstünde de derlenir,
# çağrıların kendisi yalnızca Android'de yapılır.
jni = "0.21"
ndk-context = "0.1"

# Full-text message search (src/matrix/dizin.rs). MIT. default-features = false drops zstd (a C build step for Android), the stemmer
# and the stop-word lists (we use our own Turkish-folding tokenizer); lz4_flex is pure Rust; mmap = on-disk index.
# Tam metin mesaj araması (src/matrix/dizin.rs). MIT. default-features = false zstd'yi (Android'de C derleme adımı), kök bulucuyu ve
# durak sözcük listelerini çıkarır (kendi Türkçe katlamalı ayrıştırıcımızı kullanırız); lz4_flex saf Rust; mmap = diskte dizin.
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }

# default-features = false so we choose the TLS backend ourselves: rustls (NOT OpenSSL) cross-compiles to Android easily.
# default-features = false: TLS arka ucunu biz seçeriz; rustls (OpenSSL DEĞİL) Android için kolay derlenir.
matrix-sdk = { version = "0.19", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs", "experimental-widgets"] }
matrix-sdk-ui = { version = "0.19", default-features = false, features = ["rustls-aws-lc-rs"] }

# Secret storage backends (see src/gizli_depo.rs). The OS keyring on desktop, the Android Keystore (via JNI) on Android.
# Gizli bilgi depoları (bkz. src/gizli_depo.rs). Masaüstünde işletim sistemi anahtarlığı, Android'de Android Keystore (JNI ile).
# keyring: MIT OR Apache-2.0. `crypto-rust` = pure-Rust transport encryption for the Secret Service (no OpenSSL).
# keyring: MIT OR Apache-2.0. `crypto-rust` = Secret Service için saf Rust taşıma şifrelemesi (OpenSSL yok).
[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK bindings, same version as the one wry/tauri already pull in (MIT). We need the traits to switch on WebRTC / media capture
# and to answer microphone permission requests (src/matrix/ec.rs `linux_medya_ac`). Nothing new is downloaded.
# wry/tauri'nin zaten çektiği sürümle aynı WebKitGTK bağları (MIT). WebRTC / medya yakalamayı açmak ve mikrofon izin isteklerini
# yanıtlamak için trait'ler gerekir (src/matrix/ec.rs `linux_medya_ac`). Yeni bir şey inmez.
webkit2gtk = "2.0.2"
# Same reason, same version as in the lock file: the GTK clipboard (src/masaustu_linux.rs). Nothing new is downloaded.
# Aynı gerekçe, kilit dosyasındaki sürüm: GTK panosu (src/masaustu_linux.rs). Yeni bir şey inmez.
gtk = "0.18"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# Native calls (feature `yerel-arama`: the Flatpak and the APK): MatrixRTC engine + LiveKit/libwebrtc. The crates live in ../motor (AGPL).
# Yerel aramalar (`yerel-arama` özelliği: Flatpak ve APK): MatrixRTC motoru + LiveKit/libwebrtc. Crate'ler ../motor'da (AGPL).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
matrix-rtc-call-sdk = { path = "../motor/crates/matrix-rtc-call-sdk", features = ["matrix-sdk"], optional = true }
matrix-rtc-call = { path = "../motor/crates/matrix-rtc-call", optional = true }
matrix-rtc-core = { path = "../motor/crates/matrix-rtc-core", optional = true }
matrix-rtc-transport = { path = "../motor/crates/matrix-rtc-transport", optional = true }
libwebrtc = { version = "=0.3.54", optional = true }
# Already in the tree: the engine pulls in rustls with two crypto back ends, so one must be chosen at start.
# Zaten ağaçta: motor rustls'i iki şifreleme arka ucuyla getirir, başlangıçta biri seçilmeli.
libc = { version = "0.2", optional = true }
# Already in the tree (matrix-sdk's own base): `CollectStrategy` for the encrypted names. · Zaten ağaçta (matrix-sdk'nın tabanı).
matrix-sdk-base = { version = "0.19", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"], optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Already in the dependency tree through tao/wry: same versions, so nothing new is downloaded.
# tao/wry yoluyla zaten bağımlılık ağacında: aynı sürümler, yeni bir şey inmez.
[target.'cfg(target_os = "android")'.dependencies]
# reqwest 0.13 verifies TLS certificates with Android's own verifier through this crate; it must be
# initialised once via JNI (see lib.rs) or the first HTTPS request panics. It uses jni 0.22, hence the alias.
# reqwest 0.13 TLS sertifikalarını bu crate üzerinden Android'in kendi doğrulayıcısıyla denetler; JNI ile bir kez
# başlatılmalıdır (bkz. lib.rs), yoksa ilk HTTPS isteği panik olur. jni 0.22 kullandığı için takma adla eklendi.
rustls-platform-verifier = "0.7"
jni22 = { package = "jni", version = "0.22", default-features = false }
# Rust logs → Android logcat (stdout goes nowhere on Android) / Rust günlükleri → Android logcat (Android'de stdout kaybolur)
tracing-logcat = "0.1"

# The phone APK is built in RELEASE: an unoptimized (debug) Rust build made crypto + SQLite many times slower and the app start
# took ages. LTO is off to keep the build light on the PC; symbols are stripped so the APK stays small.
# Telefon APK'sı YAYIN derlemesidir: optimize edilmemiş (debug) Rust derlemesi şifreleme + SQLite'ı kat kat yavaşlatıyor, açılış
# çok uzun sürüyordu. Derleme bilgisayarı yormasın diye LTO kapalı; APK küçük kalsın diye semboller atılır.
[profile.release]
lto = false
opt-level = 2
codegen-units = 16
debug = false
strip = true

# Dev builds (desktop `cargo tauri dev`): optimize dependencies anyway, matrix-sdk is painfully slow at opt-level 0.
# Geliştirme derlemeleri (masaüstü): bağımlılıkları yine de optimize et; matrix-sdk opt-level 0'da çok yavaş.
[profile.dev.package."*"]
opt-level = 2
